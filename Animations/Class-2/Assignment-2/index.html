<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Button Animations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="button-container">
    
    <button class="btn-link">
      <span>Awards | CES</span>
      <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line class="arrow-shaft" x1="7" y1="17" x2="17" y2="7" />
        <polyline class="arrow-head" points="7,7 17,7 17,17" />
      </svg>
    </button>

    <button class="btn-more">
      <span>SEE MORE</span>
      <svg class="icon-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line class="arrow-shaft" x1="12" y1="5" x2="12" y2="19" />
        <polyline class="arrow-head" points="5,12 12,19 19,12" />
      </svg>
    </button>

  </div>

</body>
</html>
